  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

<body>
<div class="amp-layout">
  <aside class="amp-sidebar" id="amp-sidebar"></aside>
  <div class="amp-main">
    <header class="amp-topbar" id="amp-topbar"></header>
    <main class="amp-content" id="amp-content">
<div id="pageHead"></div>
      <div class="card amp-card mb-3"><div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-md-3"><label class="form-label">Jenis Laporan</label><select class="form-select" id="repType"></select></div>
          <div class="col-md-2"><label class="form-label">Dari</label><input type="date" class="form-control" id="repFrom"></div>
          <div class="col-md-2"><label class="form-label">s.d.</label><input type="date" class="form-control" id="repTo"></div>
          <div class="col-md-3"><label class="form-label">Kategori/Unit</label><select class="form-select" id="repFilter"></select></div>
          <div class="col-md-2 d-grid gap-1"><button class="btn btn-primary btn-sm w-100" id="repRunBtn"><i class="bi bi-arrow-repeat me-1"></i>Tampilkan</button></div>
        </div>
      </div></div>
      <div class="d-flex gap-2 mb-3" id="repActions"></div>
      <div id="repResult"></div>
    </main>
  </div>
</div>
<div id="amp-modal-root"></div>

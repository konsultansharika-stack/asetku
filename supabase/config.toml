# =====================================================================
# ASSET MANAGEMENT PRO — supabase/config.toml
# Konfigurasi Supabase CLI untuk project ini.
# Jalankan: supabase start (lokal) atau supabase link --project-ref <ref>
# =====================================================================

project_id = "asset-management-pro"

[functions.calculate-depreciation]
verify_jwt = false   # dipanggil oleh pg_cron / scheduler

[functions.send-reminders]
verify_jwt = false   # dipanggil oleh pg_cron / scheduler


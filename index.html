<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · ASSET MANAGEMENT PRO</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
<div class="amp-layout">
  <aside class="amp-sidebar" id="amp-sidebar"></aside>
  <div class="amp-main">
    <header class="amp-topbar" id="amp-topbar"></header>
    <main class="amp-content" id="amp-content">

      <div id="dashHero"></div>
      <div class="d-flex flex-wrap align-items-center gap-2 mt-3" id="dashFilters"></div>
      <div class="row g-2 mt-1" id="dashStats"></div>
      <div class="row g-3 mt-1">
        <div class="col-xl-8">
          <div class="row g-3">
            <div class="col-md-6"><div class="card amp-card h-100"><div class="card-header bg-transparent py-2"><h6 class="mb-0 fw-bold">Aset per Kategori</h6></div><div class="card-body"><div class="amp-chart-box"><canvas id="chartCat"></canvas></div></div></div></div>
            <div class="col-md-6"><div class="card amp-card h-100"><div class="card-header bg-transparent py-2"><h6 class="mb-0 fw-bold">Aset per Unit</h6></div><div class="card-body"><div class="amp-chart-box"><canvas id="chartUnit"></canvas></div></div></div></div>
            <div class="col-md-6"><div class="card amp-card h-100"><div class="card-header bg-transparent py-2"><h6 class="mb-0 fw-bold">Kondisi Aset</h6></div><div class="card-body"><div class="amp-chart-box-sm"><canvas id="chartCond"></canvas></div></div></div></div>
            <div class="col-md-6"><div class="card amp-card h-100"><div class="card-header bg-transparent py-2"><h6 class="mb-0 fw-bold">Tren Pengadaan 6 Bulan</h6></div><div class="card-body"><div class="amp-chart-box-sm"><canvas id="chartTrend"></canvas></div></div></div></div>
            <div class="col-md-6"><div class="card amp-card h-100"><div class="card-header bg-transparent py-2"><h6 class="mb-0 fw-bold">Nilai Perolehan vs Nilai Buku</h6></div><div class="card-body"><div class="amp-chart-box-sm"><canvas id="chartValue"></canvas></div></div></div></div>
            <div class="col-md-6"><div class="card amp-card h-100"><div class="card-header bg-transparent py-2"><h6 class="mb-0 fw-bold">Peminjaman & Pengembalian</h6></div><div class="card-body"><div class="amp-chart-box-sm"><canvas id="chartLoans"></canvas></div></div></div></div>
          </div>
        </div>
        <div class="col-xl-4">
          <div class="card amp-card" id="widgetCard">
            <div class="card-header bg-transparent py-2"><h6 class="mb-0 fw-bold"><i class="bi bi-bell me-1 text-warning"></i>Perhatian & Tindak Lanjut</h6></div>
            <div class="card-body p-0"><div id="dashWidgets"></div></div>
          </div>
          <div class="card amp-card mt-3"><div class="card-header bg-transparent py-2"><h6 class="mb-0 fw-bold">Aset per Lokasi Teratas</h6></div><div class="card-body"><div class="amp-chart-box-sm"><canvas id="chartLoc"></canvas></div></div></div>
        </div>
      </div>
    </main>
  </div>
</div>
<div id="amp-modal-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/qr-code.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="assets/js/dashboard.js"></script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code Scanner · ASSET MANAGEMENT PRO</title>
  <link rel="icon" href="logo.svg">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/forms.css">
  <link rel="stylesheet" href="assets/css/dashboard.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
<div class="amp-layout">
  <aside class="amp-sidebar" id="amp-sidebar"></aside>
  <div class="amp-main">
    <header class="amp-topbar" id="amp-topbar"></header>
    <main class="amp-content" id="amp-content">
<div id="pageHead"></div>
      <div class="row g-3">
        <div class="col-lg-6">
          <div class="card amp-card">
            <div class="card-header bg-transparent py-2"><h6 class="mb-0 fw-bold"><i class="bi bi-qr-code-scan me-1"></i>Pindai QR Code</h6></div>
            <div class="card-body">
              <div id="qrReader" class="mb-2" style="width:100%"></div>
              <div class="d-flex gap-2 mb-3">
                <button class="btn btn-outline-secondary btn-sm" id="qrStartBtn"><i class="bi bi-camera-video me-1"></i>Mulai Kamera</button>
                <button class="btn btn-outline-secondary btn-sm" id="qrStopBtn"><i class="bi bi-stop-circle me-1"></i>Stop</button>
              </div>
              <label class="form-label">Atau masukkan kode inventaris / token QR manual</label>
              <div class="input-group mb-2">
                <input class="form-control" id="manualCode" placeholder="cth: KMP/2023/0001">
                <button class="btn btn-primary" id="manualGoBtn"><i class="bi bi-search"></i> Cari</button>
              </div>
              <div class="form-text">QR berisi token referensi unik — data aset diambil dari server setelah autentikasi.</div>
            </div>
          </div>
        </div>
        <div class="col-lg-6"><div id="scanResult"></div></div>
        <div class="col-12"><div class="card amp-card"><div class="card-header bg-transparent py-2"><h6 class="mb-0 fw-bold">Riwayat Pemindaian</h6></div><div class="card-body p-0"><div id="scanTable" class="p-2"></div></div></div></div>
      </div>
    </main>
  </div>
</div>
<div id="amp-modal-root"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="assets/js/supabase-config.js"></script>
  <script src="assets/js/demo-data.js"></script>
  <script src="assets/js/db.js"></script>
  <script src="assets/js/ui.js"></script>
  <script src="assets/js/qr-code.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script src="assets/js/qr-scanner.js"></script>
</body>
</html>
